services:
  # Volumes made by the old minio/minio image are owned by root, and the
  # non-root image below can't open them. This hands the volume to uid 65532
  # once, then exits; it does nothing on a volume that is already right.
  minio-volume:
    image: cgr.dev/chainguard/minio@sha256:68aab277f9748c7c3eb85f178744adba1655c8e33a86987b22d2879ca507c332
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - '[ "$$(stat -c %u /data)" = 65532 ] || chown -R 65532:65532 /data'
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    # MinIO stopped publishing minio/minio and minio/mc; Chainguard's free
    # builds are pinned by digest. The image runs as uid 65532.
    image: cgr.dev/chainguard/minio@sha256:68aab277f9748c7c3eb85f178744adba1655c8e33a86987b22d2879ca507c332
    depends_on:
      minio-volume:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    # The server image carries mc and a shell; the client image has no shell.
    image: cgr.dev/chainguard/minio@sha256:68aab277f9748c7c3eb85f178744adba1655c8e33a86987b22d2879ca507c332
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/shareplan || true;
      exit 0;
      "

volumes:
  minio-data:
